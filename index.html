<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZS – World Builder</title>
  <meta name="description" content="ZS – World Builder. Art, about, shop.">
  <meta name="theme-color" content="#4ab6f0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%234ab6f0' stroke='%23ff69b4' stroke-width='10'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #4ab6f0;
      --pink: #ff69b4;
      --pink-deep: #ff4fa3;
      --pad: clamp(1.25rem, 4vw, 3rem);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--blue);
      color: var(--pink);
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      align-items: center;
      padding:
        calc(var(--pad) + env(safe-area-inset-top, 0px))
        var(--pad)
        calc(var(--pad) + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }

    .tagline {
      margin: 0;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .logo {
      display: block;
      width: min(62vw, 52vh, 440px);
      height: auto;
      color: var(--pink);
    }

    .logo-link { display: block; border-radius: 50%; }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6em;
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 500;
    }

    nav li + li::before {
      content: "/";
      margin-right: 0.6em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav a {
      padding: 0.15em 0.1em;
      border-bottom: 3px solid transparent;
      transition: border-color 0.15s ease;
    }

    nav a:hover { border-bottom-color: currentColor; }

    a:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="tagline">World Builder</h1>

    <a class="logo-link" href="/" aria-label="ZS home">
      <svg class="logo" viewBox="0 0 500 500" role="img" aria-label="ZS logo" xmlns="http://www.w3.org/2000/svg">
        <circle cx="250" cy="250" r="228" fill="none" stroke="currentColor" stroke-width="42"/>
        <text x="250" y="322" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-weight="900" font-size="230" letter-spacing="-8" fill="currentColor">ZS</text>
      </svg>
    </a>

    <nav aria-label="Main">
      <ul>
        <li><a href="/art">art</a></li>
        <li><a href="/about">about</a></li>
        <li><a href="/shop">shop</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
